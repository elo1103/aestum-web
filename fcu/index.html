  <!-- Flyer QR entry point: counted as its own path, then forwarded to the homepage. -->
  <meta http-equiv="refresh" content="3;url=/">
  <script>
    (() => {
      const analyticsToken = '4b527262fcf54f418057d03f8b2c0d25';
      if (analyticsToken && location.hostname === 'aestum.co') {
        const beacon = document.createElement('script');
        beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        beacon.dataset.cfBeacon = JSON.stringify({token: analyticsToken});
        document.head.append(beacon);
      }
      addEventListener('load', () => setTimeout(() => location.replace(location.hostname === 'aestum.co' ? '/' : '../index.html'), 600));
    })();
  </script>
